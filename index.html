<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Волшебный песочный стол</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100svh;
  background:#111536;
  font-family:system-ui,Arial,sans-serif;
  overflow:hidden;
}
.scene{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  touch-action:none;
  user-select:none;
}
canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
  cursor:none;
}
.hint{
  position:absolute;
  top:2%;
  left:2%;
  max-width:43%;
  padding:8px 12px;
  border-radius:11px;
  background:#fff2d4e8;
  color:#4b3324;
  font-size:clamp(11px,1.3vw,16px);
  line-height:1.3;
  pointer-events:none;
}
.controls{
  position:fixed;
  z-index:2;
  left:0;
  right:0;
  bottom:max(12px,env(safe-area-inset-bottom));
  display:flex;
  justify-content:center;
  pointer-events:none;
}
.controls button{pointer-events:auto}
button{
  min-height:44px;
  padding:10px 20px;
  border:1px solid #e6c98d;
  border-radius:13px;
  background:linear-gradient(#fff0c7,#e6bc78);
  color:#493223;
  box-shadow:0 4px 12px #0004;
  font:700 15px system-ui,sans-serif;
  cursor:pointer;
}
@media(max-width:600px){
  .hint{padding:5px 7px;border-radius:7px;font-size:9px}
  button{font-size:13px}
}
</style>
</head>
<body>
<div class="scene">
  <canvas id="game"
    aria-label="Рисуйте пальцем или мышкой на песочном столе"></canvas>
  <div class="hint" id="hint">Проведи пальцем или мышкой по песку</div>
</div>
<div class="controls">
  <button id="reset">Разровнять песок</button>
</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const hint=document.getElementById("hint");

const pane={x:265,y:77,w:425,h:379};
const radius=17;

const layer=document.createElement("canvas");
layer.width=pane.w;
layer.height=pane.h;
const sand=layer.getContext("2d");

const floor=new Image();
const table=new Image();
const texture=new Image();
const dog=new Image();
const sparkle=new Image();

let ready=false;
let drawing=false;
let visible=false;
let last=null;
let pointer={x:0,y:0};
let flying=[];

let phase="draw";
let drawMs=0;
let lastMoveAt=0;
let lastFrame=performance.now();
let magicStart=0;
let oldMarks=null;

// Огоньки проходят по светлым линиям рисунка собаки.
const traces=[
  {start:0, duration:.29,
   points:[[180,340],[225,270],[290,230],[340,280],[335,340],[295,405],[220,445]]},

  {start:.07, duration:.30,
   points:[[250,445],[185,445],[155,500],[185,550],[250,555],[310,520],[340,480]]},

  {start:.12, duration:.32,
   points:[[335,295],[410,285],[485,310],[560,350],[650,390]]},

  {start:.25, duration:.29,
   points:[[585,360],[640,400],[690,475],[685,535],[650,565],[605,525],[570,460],[565,390]]},

  {start:.33, duration:.34,
   points:[[320,535],[365,590],[385,685],[385,780],[370,880],[320,985],[265,1030],[320,1050],[385,1020],[430,945]]},

  {start:.43, duration:.32,
   points:[[385,775],[470,810],[520,875],[545,965],[520,1030],[570,1050],[620,1035],[650,930]]},

  {start:.46, duration:.37,
   points:[[690,600],[780,620],[875,630],[955,615],[1030,560],[1080,470],[1075,390],[1035,345]]},

  {start:.59, duration:.28,
   points:[[645,920],[750,915],[840,865],[880,915],[915,955],[885,1025],[945,1040]]},

  {start:.68, duration:.25,
   points:[[930,665],[980,750],[1030,855],[1065,960],[1035,1030],[1080,1050],[1130,1030]]},

  {start:.08, duration:.13,
   points:[[350,390],[335,390]]},

  {start:.22, duration:.12,
   points:[[445,445],[440,445]]},

  {start:.18, duration:.12,
   points:[[200,490],[200,490]]}
];

const reveal=document.createElement("canvas");
reveal.width=reveal.height=512;
const revealCtx=reveal.getContext("2d");

const mask=document.createElement("canvas");
mask.width=mask.height=512;
const maskCtx=mask.getContext("2d");

let scale=1;
let offsetX=0;
let offsetY=0;

function resize(){
  const box=canvas.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);

  canvas.width=Math.round(box.width*dpr);
  canvas.height=Math.round(box.height*dpr);

  const logicalWidth=box.width<box.height?560:960;
  scale=Math.min(
    canvas.width/logicalWidth,
    canvas.height/540
  );

  offsetX=(canvas.width-960*scale)/2;
  offsetY=(canvas.height-540*scale)/2;
}

window.addEventListener("resize",resize);
resize();

function load(image,path){
  return new Promise((resolve,reject)=>{
    image.onload=resolve;
    image.onerror=()=>reject(new Error("Не удалось загрузить "+path));
    image.src=path;
  });
}

async function loadFirst(image,paths){
  let lastError;

  for(const path of paths){
    try{
      await load(image,path);
      return;
    }catch(error){
      lastError=error;
    }
  }

  throw lastError;
}

function fillSand(){
  sand.globalCompositeOperation="source-over";
  sand.clearRect(0,0,pane.w,pane.h);

  const ratio=pane.w/pane.h;
  const sw=Math.min(texture.width,texture.height*ratio);
  const sh=sw/ratio;

  sand.drawImage(
    texture,
    (texture.width-sw)/2,
    (texture.height-sh)/2,
    sw,sh,
    0,0,pane.w,pane.h
  );

  flying=[];
}

function inside(x,y){
  return x>=pane.x+5
      && x<pane.x+pane.w-5
      && y>=pane.y+5
      && y<pane.y+pane.h-5;
}

function position(event){
  const box=canvas.getBoundingClientRect();

  return {
    x:((event.clientX-box.left)*canvas.width/box.width-offsetX)/scale,
    y:((event.clientY-box.top)*canvas.height/box.height-offsetY)/scale
  };
}

function drawBackground(){
  const factor=Math.max(
    canvas.width/floor.width,
    canvas.height/floor.height
  );

  const w=floor.width*factor;
  const h=floor.height*factor;

  ctx.drawImage(
    floor,
    (canvas.width-w)/2,
    (canvas.height-h)/2,
    w,h
  );
}

function stamp(x,y,dx,dy){
  if(!inside(x,y))return;

  const sx=x-pane.x;
  const sy=y-pane.y;
  const r=radius;

  const fade=sand.createRadialGradient(
    sx,sy,r*.14,
    sx,sy,r
  );

  fade.addColorStop(0,"rgba(0,0,0,.98)");
  fade.addColorStop(.48,"rgba(0,0,0,.92)");
  fade.addColorStop(.78,"rgba(0,0,0,.38)");
  fade.addColorStop(1,"rgba(0,0,0,0)");

  sand.globalCompositeOperation="destination-out";
  sand.fillStyle=fade;
  sand.beginPath();
  sand.arc(sx,sy,r,0,Math.PI*2);
  sand.fill();

  sand.globalCompositeOperation="source-over";

  const len=Math.hypot(dx,dy)||1;
  const nx=-dy/len;
  const ny=dx/len;

  for(const side of [-1,1]){
    const bx=sx+nx*r*.84*side;
    const by=sy+ny*r*.84*side;

    if(bx<3||by<3||bx>pane.w-3||by>pane.h-3)continue;

    const ridge=sand.createRadialGradient(
      bx,by,1,
      bx,by,7
    );

    ridge.addColorStop(0,"rgba(255,226,162,.46)");
    ridge.addColorStop(.55,"rgba(157,99,51,.21)");
    ridge.addColorStop(1,"rgba(105,64,37,0)");

    sand.fillStyle=ridge;
    sand.beginPath();
    sand.arc(bx,by,7,0,Math.PI*2);
    sand.fill();

    for(let j=0;j<5;j++){
      const spread=r*(.77+Math.random()*.42);
      const along=(Math.random()-.5)*9;
      const px=sx+nx*spread*side+dx/len*along;
      const py=sy+ny*spread*side+dy/len*along;

      if(px<2||py<2||px>pane.w-2||py>pane.h-2)continue;

      const size=.45+Math.random()*1.25;
      const color=Math.random()<.55
        ?"#f8d693"
        :Math.random()<.6?"#d39b57":"#9e693e";

      sand.fillStyle=color;
      sand.fillRect(px,py,size,size*.8);

      if(Math.random()<.34&&flying.length<180){
        flying.push({
          x:px,
          y:py,
          vx:nx*side*(.6+Math.random()*1.4),
          vy:ny*side*(.6+Math.random()*1.4),
          size,
          color,
          age:0,
          life:9+Math.random()*9
        });
      }
    }
  }
}

function drawMovingGrains(){
  const remaining=[];

  ctx.save();
  ctx.beginPath();
  ctx.rect(pane.x,pane.y,pane.w,pane.h);
  ctx.clip();

  for(const p of flying){
    p.x+=p.vx;
    p.y+=p.vy;
    p.vx*=.88;
    p.vy*=.88;
    p.age++;

    if(p.age>=p.life){
      if(p.x>1&&p.y>1&&p.x<pane.w-1&&p.y<pane.h-1){
        sand.fillStyle=p.color;
        sand.fillRect(p.x,p.y,p.size,p.size*.8);
      }
    }else{
      ctx.globalAlpha=Math.min(1,(p.life-p.age)/5);
      ctx.fillStyle=p.color;
      ctx.fillRect(
        pane.x+p.x,
        pane.y+p.y,
        p.size,
        p.size*.8
      );
      remaining.push(p);
    }
  }

  ctx.restore();
  flying=remaining;
}

function beginMagic(now){
  phase="magic";
  drawing=false;
  visible=false;
  magicStart=now;
  hint.textContent="Смотри, кто появляется!";

  oldMarks=document.createElement("canvas");
  oldMarks.width=pane.w;
  oldMarks.height=pane.h;
  oldMarks.getContext("2d").drawImage(layer,0,0);

  fillSand();
}

function clamp01(value){
  return Math.max(0,Math.min(1,value));
}

function pointOnTrace(points,t){
  const lengths=[];
  let total=0;

  for(let i=1;i<points.length;i++){
    const d=Math.hypot(
      points[i][0]-points[i-1][0],
      points[i][1]-points[i-1][1]
    );

    lengths.push(d);
    total+=d;
  }

  let distance=total*clamp01(t);

  for(let i=0;i<lengths.length;i++){
    if(distance<=lengths[i]||i===lengths.length-1){
      const f=lengths[i]?distance/lengths[i]:0;

      return {
        x:points[i][0]+(points[i+1][0]-points[i][0])*f,
        y:points[i][1]+(points[i+1][1]-points[i][1])*f
      };
    }

    distance-=lengths[i];
  }

  return {x:points[0][0],y:points[0][1]};
}

function dogRect(){
  const size=Math.min(pane.w*.93,pane.h*.94);

  return {
    x:pane.x+(pane.w-size)/2,
    y:pane.y+(pane.h-size)/2,
    size
  };
}

function drawDog(now){
  if(phase==="draw")return;

  const rect=dogRect();

  if(phase==="dog"){
    ctx.drawImage(dog,rect.x,rect.y,rect.size,rect.size);
    return;
  }

  const elapsed=now-magicStart;
  const progress=clamp01((elapsed-180)/1950);

  if(progress<=0)return;

  maskCtx.clearRect(0,0,512,512);
  maskCtx.save();
  maskCtx.scale(512/1254,512/1254);
  maskCtx.strokeStyle="#fff";
  maskCtx.fillStyle="#fff";
  maskCtx.lineWidth=125;
  maskCtx.lineCap="round";
  maskCtx.lineJoin="round";

  for(const trace of traces){
    const t=clamp01((progress-trace.start)/trace.duration);
    if(t<=0)continue;

    const pts=trace.points;
    const lengths=[];
    let total=0;

    for(let i=1;i<pts.length;i++){
      const d=Math.hypot(
        pts[i][0]-pts[i-1][0],
        pts[i][1]-pts[i-1][1]
      );

      lengths.push(d);
      total+=d;
    }

    let remaining=total*t;

    maskCtx.beginPath();
    maskCtx.moveTo(pts[0][0],pts[0][1]);

    for(let i=0;i<lengths.length&&remaining>0;i++){
      const f=Math.min(1,remaining/(lengths[i]||1));

      maskCtx.lineTo(
        pts[i][0]+(pts[i+1][0]-pts[i][0])*f,
        pts[i][1]+(pts[i+1][1]-pts[i][1])*f
      );

      remaining-=lengths[i];
    }

    maskCtx.stroke();

    if(total===0){
      maskCtx.beginPath();
      maskCtx.arc(pts[0][0],pts[0][1],62,0,Math.PI*2);
      maskCtx.fill();
    }
  }

  maskCtx.restore();

  revealCtx.clearRect(0,0,512,512);
  revealCtx.globalCompositeOperation="source-over";
  revealCtx.drawImage(dog,0,0,512,512);

  revealCtx.globalCompositeOperation="destination-in";
  revealCtx.drawImage(mask,0,0);

  revealCtx.globalCompositeOperation="source-over";
  ctx.drawImage(reveal,rect.x,rect.y,rect.size,rect.size);

  // Оставшиеся мелкие детали плавно проявляются в конце.
  if(progress>.82){
    ctx.save();
    ctx.globalAlpha=clamp01((progress-.82)/.18);
    ctx.drawImage(dog,rect.x,rect.y,rect.size,rect.size);
    ctx.restore();
  }
}

function drawMagic(now){
  if(phase!=="magic")return;

  const progress=clamp01((now-magicStart-180)/1950);
  const rect=dogRect();

  ctx.save();
  ctx.translate(offsetX,offsetY);
  ctx.scale(scale,scale);

  ctx.beginPath();
  ctx.roundRect(pane.x,pane.y,pane.w,pane.h,7);
  ctx.clip();

  for(let i=0;i<traces.length;i++){
    const trace=traces[i];
    const t=(progress-trace.start)/trace.duration;

    if(t<=0||t>=1)continue;

    const p=pointOnTrace(trace.points,t);
    const x=rect.x+p.x/1254*rect.size;
    const y=rect.y+p.y/1254*rect.size;
    const alpha=Math.min(1,t*7,(1-t)*9);
    const size=i%4===0?35:24;
    const pulse=1+.13*Math.sin(now*.012+i*3);

    ctx.globalAlpha=alpha*.48;

    const halo=ctx.createRadialGradient(x,y,0,x,y,size*.95);
    halo.addColorStop(0,"rgba(255,248,215,.85)");
    halo.addColorStop(.35,"rgba(255,210,118,.45)");
    halo.addColorStop(1,"rgba(255,210,118,0)");

    ctx.fillStyle=halo;
    ctx.beginPath();
    ctx.arc(x,y,size*.95,0,Math.PI*2);
    ctx.fill();

    ctx.globalAlpha=alpha;

    if(sparkle.complete&&sparkle.naturalWidth){
      const s=size*pulse;
      ctx.drawImage(sparkle,x-s/2,y-s/2,s,s);
    }else{
      ctx.fillStyle="#fff4c4";
      ctx.beginPath();
      ctx.arc(x,y,2.5,0,Math.PI*2);
      ctx.fill();
    }

    // Маленькие золотые и голубоватые пылинки.
    for(let j=0;j<5;j++){
      const angle=i*2.4+j*2.4;
      const d=7+j*2.4+2*Math.sin(now*.004+i+j);

      ctx.globalAlpha=alpha*(.28+j*.1);
      ctx.fillStyle=j%3===0?"#c8def5":"#ffe8aa";

      ctx.beginPath();
      ctx.arc(
        x+Math.cos(angle)*d,
        y+Math.sin(angle)*d,
        j%3===0?1:1.6,
        0,
        Math.PI*2
      );
      ctx.fill();
    }
  }

  ctx.restore();

  if(now-magicStart>2300){
    phase="dog";
    oldMarks=null;
    hint.textContent="Кто появился? Собака!";
  }
}

function moveBrush(from,to){
  const dx=to.x-from.x;
  const dy=to.y-from.y;

  const steps=Math.max(
    1,
    Math.ceil(Math.hypot(dx,dy)/4)
  );

  for(let i=0;i<=steps;i++){
    const t=i/steps;

    stamp(
      from.x+dx*t,
      from.y+dy*t,
      dx,dy
    );
  }
}

canvas.addEventListener("pointerdown",event=>{
  if(!ready||phase!=="draw")return;

  const p=position(event);
  if(!inside(p.x,p.y))return;

  event.preventDefault();
  canvas.setPointerCapture(event.pointerId);

  drawing=true;
  lastMoveAt=performance.now();
  visible=true;
  pointer=p;
  last=p;

  stamp(p.x,p.y,1,0);
  hint.textContent="Посмотри, как светится след под песком";
});

canvas.addEventListener("pointermove",event=>{
  if(!ready||phase!=="draw")return;

  const p=position(event);
  pointer=p;
  visible=inside(p.x,p.y);

  if(!drawing||!last)return;

  event.preventDefault();

  if(Math.hypot(p.x-last.x,p.y-last.y)>.7){
    moveBrush(last,p);
    lastMoveAt=performance.now();
  }

  last=p;
});

function release(){
  drawing=false;
  last=null;
}

canvas.addEventListener("pointerup",release);
canvas.addEventListener("pointercancel",release);

canvas.addEventListener("pointerleave",()=>{
  if(!drawing)visible=false;
});

document.getElementById("reset").addEventListener("click",()=>{
  if(!ready)return;

  fillSand();
  phase="draw";
  drawMs=0;
  drawing=false;
  visible=false;
  oldMarks=null;
  hint.textContent="Проведи пальцем или мышкой по песку";
});

function render(now){
  const delta=Math.min(50,now-lastFrame);
  lastFrame=now;

  // Считаем время, пока ребёнок двигает кисточкой.
  if(
    ready
    &&phase==="draw"
    &&drawing
    &&now-lastMoveAt<220
  ){
    drawMs+=delta;

    if(drawMs>=3500){
      beginMagic(now);
    }
  }

  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(ready){
    drawBackground();

    ctx.save();
    ctx.translate(offsetX,offsetY);
    ctx.scale(scale,scale);

    ctx.drawImage(table,0,0,960,540);

    ctx.save();
    ctx.beginPath();
    ctx.roundRect(
      pane.x,pane.y,pane.w,pane.h,7
    );
    ctx.clip();

    ctx.drawImage(layer,pane.x,pane.y);

    if(phase==="magic"&&oldMarks){
      const fade=1-clamp01((now-magicStart-100)/650);

      ctx.globalAlpha=fade;
      ctx.drawImage(oldMarks,pane.x,pane.y);
      ctx.globalAlpha=1;
    }

    drawDog(now);

    ctx.restore();
    drawMovingGrains();

    if(visible&&inside(pointer.x,pointer.y)){
      ctx.save();
      ctx.translate(pointer.x,pointer.y);
      ctx.rotate(-.55);

      ctx.shadowColor="#3b261b77";
      ctx.shadowBlur=4;

      ctx.fillStyle="#8d5b32";
      ctx.fillRect(-3,-34,6,26);

      ctx.fillStyle="#d2b486";
      ctx.beginPath();
      ctx.moveTo(-5,-8);
      ctx.lineTo(5,-8);
      ctx.lineTo(1,1);
      ctx.fill();

      ctx.restore();
    }

    ctx.restore();
    drawMagic(now);
  }

  requestAnimationFrame(render);
}

Promise.all([
  load(floor,"fon1.png"),
  load(table,"stol1.png"),
  load(texture,"pesok.png"),
  loadFirst(dog,["sobaka.png","gitkeep/dog.png"])
])
.then(()=>{
  fillSand();
  ready=true;

  // Если файл блика отсутствует, игра всё равно работает.
  loadFirst(
    sparkle,
    ["blik.png","gitkeep/blik.png"]
  ).catch(()=>{});
})
.catch(error=>{
  hint.textContent=error.message;
  console.error(error);
});

requestAnimationFrame(render);
</script>
</body>
</html>
