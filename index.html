<title>Волшебный песочный стол</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100svh;background:#111536;font-family:system-ui,Arial,sans-serif;overflow:hidden}
.scene{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:none}
canvas.finished{cursor:default}
.menu{position:fixed;z-index:4;inset:0;display:grid;place-content:center;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,2vw,26px);width:min(90vw,840px);margin:auto;pointer-events:none}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;height:auto;min-height:0;padding:0;border:0;background:none;box-shadow:none;line-height:0;pointer-events:auto;transition:transform .2s,filter .2s}
.menu button:hover,.menu button:focus-visible{transform:scale(1.045);filter:brightness(1.1);outline:none}
.menu img{display:block;width:100%;height:auto}
.menu-status{position:fixed;z-index:5;bottom:clamp(8px,3vh,24px);left:5vw;right:5vw;text-align:center;color:#fff5de;text-shadow:0 2px 5px #17114a;font-size:14px;pointer-events:none}
.back{position:fixed;z-index:3;right:clamp(8px,2vw,24px);top:clamp(8px,2vh,20px);font-size:13px;padding:7px 13px;min-height:38px}
.back[hidden],.controls[hidden]{display:none}
.controls{position:fixed;z-index:2;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}
.controls button{pointer-events:auto}
.controls button[hidden]{display:none}
.pattern{position:absolute;z-index:2;left:clamp(8px,2vw,24px);top:50%;transform:translateY(-50%);width:clamp(82px,15vw,150px);padding:10px;border:1px solid #cbb8ee99;border-radius:17px;background:#63518b99;color:#fff7ec;text-align:center;box-shadow:0 8px 25px #080c3077;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pattern svg{display:block;width:100%;height:auto;stroke:#ffdea5;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
.pattern strong{display:block;font-size:clamp(11px,1.4vw,16px)}
.pattern.hidden{display:none}
.word{position:fixed;z-index:2;left:clamp(8px,2vw,24px);top:50%;transform:translateY(-50%);max-width:clamp(82px,17vw,170px);padding:10px 13px;border:1px solid #d7c4f099;border-radius:15px;background:#63518baa;color:#fff5df;text-align:center;text-shadow:0 1px 4px #2b1c53;font-size:clamp(13px,2vw,23px);font-weight:700;box-shadow:0 8px 25px #080c3077;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none}
.word[hidden]{display:none}
.end{position:fixed;z-index:6;inset:0;display:grid;place-items:center;background:#0f143b88;padding:16px}
.end[hidden]{display:none}
.end-card{width:min(90vw,380px);padding:30px 24px;border:1px solid #e1c9efaa;border-radius:24px;background:#453366e6;color:#fff4df;text-align:center;box-shadow:0 18px 55px #08092599;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.end-card p{margin:0 0 22px;font-size:clamp(20px,3vw,28px);font-weight:700;line-height:1.35}
.intro{position:fixed;z-index:6;inset:0;display:grid;place-items:center;padding:18px;background:#0c174576;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.intro[hidden]{display:none}
.intro-card{width:min(90vw,530px);padding:clamp(22px,4vw,36px);border:1px solid #b9d9ffad;border-radius:23px;background:linear-gradient(145deg,#6e8fc19c,#574d94b8);color:#fffaf2;text-align:center;box-shadow:0 18px 55px #0a133b99,inset 0 1px 20px #c0d9ff55;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.intro-card p{margin:0 0 24px;font-size:clamp(17px,2.3vw,23px);line-height:1.55;text-shadow:0 2px 8px #1d2867}
#next{display:none}
#next.show{display:block}
button{min-height:44px;padding:10px 20px;border:1px solid #e6c98d;border-radius:13px;background:linear-gradient(#fff0c7,#e6bc78);color:#493223;box-shadow:0 4px 12px #0004;font:700 15px system-ui,sans-serif;cursor:pointer}
@media(max-width:600px){
  button{font-size:13px}
  .pattern{top:52%;left:5px;padding:5px;border-radius:10px;width:72px}
  .pattern strong{font-size:10px}
  .menu{width:96vw;gap:4px}
  .back{font-size:11px;min-height:34px}
}
</style>

function decodeContours(){
  const bytes=atob(contourEncoded);
  let offset=0;
  function read(){
    let value=0,shift=0,byte;
    do{
      byte=bytes.charCodeAt(offset++);
      value|=(byte&127)<<shift;
      shift+=7;
    }while(byte&128);
    return value;
  }
  function signed(value){return(value>>>1)^-(value&1)}
  const result={};
  for(const key of contourKeys){
    const paths=[];
    const pathCount=read();
    for(let i=0;i<pathCount;i++){
      const points=[];
      const count=read();
      let x=0,y=0;
      for(let j=0;j<count;j++){
        x+=signed(read());
        y+=signed(read());
        points.push([x,y]);
      }
      paths.push(points);
    }
    result[key]=paths;
  }
  return result;
}
const contourPaths=decodeContours();
function activeTraces(){

    const round=rounds[roundIndex];

      const paths=picturePaths[roundIndex];
      round.traceCache=paths.map((points,i)=>({points,start:i/paths.length*.68,duration:.31}));
    }
    return round.traceCache;
  }
  const round=rounds[roundIndex];
  if(!round.traceCache){

    const paths=contourPaths[key];
    round.traceCache=paths.map((points,i)=>({

      width:i===0?165:125
    }));
  }
  return round.traceCache;
}

}

function resample(points,count=32){
  const distances=[0];
  for(let i=1;i<points.length;i++){
    distances.push(distances[i-1]+Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y));
  }
  const total=distances[distances.length-1];
  if(total<1)return[];
  const result=[];
  let j=1;
  for(let i=0;i<count;i++){
    const target=total*i/(count-1);
    while(j<distances.length-1&&distances[j]<target)j++;
    const d=distances[j]-distances[j-1];
    const t=d?(target-distances[j-1])/d:0;
    result.push({
      x:points[j-1].x+(points[j].x-points[j-1].x)*t,
      y:points[j-1].y+(points[j].y-points[j-1].y)*t
    });
  }
  return result;
}
function shapePath(kind,count=32){
  return Array.from({length:count},(_,i)=>{
    const t=i/(count-1);
    if(kind==="wave")return{x:t,y:.5+.45*Math.sin(t*Math.PI*4)};
    if(kind==="zigzag")return{x:t,y:.5-.45*Math.cos(t*Math.PI*4)};
    const arc=1-Math.pow(2*t-1,2);
    return{x:t,y:kind==="smile"?.1+.8*arc:.9-.8*arc};
  });
}
function matchesPattern(points,kind){
  if(points.length<5)return false;
  const minX=Math.min(...points.map(p=>p.x));
  const maxX=Math.max(...points.map(p=>p.x));
  const minY=Math.min(...points.map(p=>p.y));
  const maxY=Math.max(...points.map(p=>p.y));
  const w=maxX-minX,h=maxY-minY;
  if(w<40||h<16)return false;
  const sampled=resample(points);
  const length=points.slice(1).reduce((sum,p,i)=>sum+Math.hypot(p.x-points[i].x,p.y-points[i].y),0);
  if(length<70)return false;
  const first=points[0],last=points[points.length-1];
  if(kind==="star"){
    if(w<50||h<40||w/h<.55||w/h>1.8||length<160)return false;
    let corners=0,lastCorner=-4;
    for(let i=3;i<sampled.length-3;i++){
      const a=sampled[i-3],b=sampled[i],c=sampled[i+3];
      const u=Math.atan2(b.y-a.y,b.x-a.x);
      const v=Math.atan2(c.y-b.y,c.x-b.x);
      const turn=Math.abs(Math.atan2(Math.sin(v-u),Math.cos(v-u)));
      if(turn>.6&&i-lastCorner>3){corners++;lastCorner=i}
    }
    return corners>=3||(strokes.length>=3&&corners>=2);
  }
  if(kind==="square"||kind==="circle"||kind==="triangle"){
    if(w/h<.45||w/h>2.2)return false;
    const gap=Math.hypot(first.x-last.x,first.y-last.y);
    const cx=(minX+maxX)/2,cy=(minY+maxY)/2;
    let sweep=0;
    for(let i=1;i<sampled.length;i++){
      const a=Math.atan2(sampled[i-1].y-cy,sampled[i-1].x-cx);
      const b=Math.atan2(sampled[i].y-cy,sampled[i].x-cx);
      sweep+=Math.atan2(Math.sin(b-a),Math.cos(b-a));
    }
    return Math.abs(sweep)>4.1&&gap<Math.hypot(w,h)*.75;
  }
  if(kind==="balloon"){
    if(strokes.length<2)return false;
    const circle=strokes.slice(0,-1).flat();
    const tail=strokes[strokes.length-1];
    if(circle.length<5||tail.length<2)return false;
    const top=Math.min(...circle.map(p=>p.y));
    const bottom=Math.max(...circle.map(p=>p.y));
    const left=Math.min(...circle.map(p=>p.x));
    const right=Math.max(...circle.map(p=>p.x));
    const gap=Math.hypot(circle[0].x-circle.at(-1).x,circle[0].y-circle.at(-1).y);
    return right-left>40&&bottom-top>40&&
      gap<Math.hypot(right-left,bottom-top)*.8&&
      Math.max(...tail.map(p=>p.y))>bottom+12;
  }
  if(kind==="cloud"||kind==="bush"||kind==="heart"){
    if(w/h<.75)return false;
    const gap=Math.hypot(first.x-last.x,first.y-last.y);
    if(gap>Math.hypot(w,h)*.9)return false;
    if(kind==="heart"){
      const topLeft=points.filter(p=>p.x>minX+w*.12&&p.x<minX+w*.42)
        .reduce((v,p)=>Math.min(v,p.y),Infinity);
      const topRight=points.filter(p=>p.x>minX+w*.58&&p.x<minX+w*.88)
        .reduce((v,p)=>Math.min(v,p.y),Infinity);
      const topCenter=points.filter(p=>p.x>minX+w*.44&&p.x<minX+w*.56&&p.y<minY+h*.5)
        .reduce((v,p)=>Math.min(v,p.y),Infinity);
      return topCenter<Infinity&&topCenter>Math.min(topLeft,topRight)+h*.08;
    }
    let changes=0,previous=0;
    for(let i=2;i<sampled.length;i++){
      const dy=sampled[i].y-sampled[i-2].y;
      const direction=Math.abs(dy)>h*.05?Math.sign(dy):0;
      if(direction&&previous&&direction!==previous)changes++;
      if(direction)previous=direction;
    }
    return changes>=2;
  }
  if(w/h<.75)return false;
  const normalized=sampled.map(p=>({x:(p.x-minX)/w,y:(p.y-minY)/h}));
  const oriented=first.x<=last.x?normalized:[...normalized].reverse();
  const ends=(oriented[2].y+oriented[29].y)/2;
  const middle=(oriented[13].y+oriented[16].y+oriented[19].y)/3;
  if(kind==="smile")return middle-ends>.20;
  if(kind==="arch")return ends-middle>.20;
  let turns=0,direction=0,extreme=oriented[0].y;
  for(let i=1;i<oriented.length;i++){
    const y=oriented[i].y;
    if(direction>=0){
      extreme=Math.max(extreme,y);
      if(extreme-y>.23){turns++;direction=-1;extreme=y}
    }else{
      extreme=Math.min(extreme,y);
      if(y-extreme>.23){turns++;direction=1;extreme=y}
    }
  }
  if(turns>=2)return true;
  const model=shapePath(kind);
  const score=list=>list.reduce((sum,p,i)=>sum+Math.hypot(p.x-model[i].x,p.y-model[i].y),0)/list.length;
  return score(oriented)<.43;
}
function combinedStrokes(){
  const result=[];
  for(const part of strokes){
    if(!part.length)continue;
    let next=part;
    if(result.length){
      const end=result[result.length-1];
      const first=part[0],last=part[part.length-1];
      if(Math.hypot(end.x-last.x,end.y-last.y)<Math.hypot(end.x-first.x,end.y-first.y)){
        next=[...part].reverse();
      }
    }
    result.push(...next);
  }
  return result;
}

  sand.globalCompositeOperation="source-over";
  const len=Math.hypot(dx,dy)||1;
  const nx=-dy/len,ny=dx/len;
  for(const side of[-1,1]){
    const bx=sx+nx*r*.84*side,by=sy+ny*r*.84*side;
    if(bx<3||by<3||bx>pane.w-3||by>pane.h-3)continue;
    const ridge=sand.createRadialGradient(bx,by,1,bx,by,7);
    ridge.addColorStop(0,"rgba(255,226,162,.46)");
    ridge.addColorStop(.55,"rgba(157,99,51,.21)");
    ridge.addColorStop(1,"rgba(105,64,37,0)");
    sand.fillStyle=ridge;
    sand.beginPath();
    sand.arc(bx,by,7,0,Math.PI*2);
    sand.fill();
    for(let j=0;j<5;j++){
      const spread=r*(.77+Math.random()*.42);
      const along=(Math.random()-.5)*9;
      const px=sx+nx*spread*side+dx/len*along;
      const py=sy+ny*spread*side+dy/len*along;
      if(px<2||py<2||px>pane.w-2||py>pane.h-2)continue;
      const size=.45+Math.random()*1.25;
      const color=Math.random()<.55?"#f8d693":Math.random()<.6?"#d39b57":"#9e693e";
      sand.fillStyle=color;
      sand.fillRect(px,py,size,size*.8);
      if(Math.random()<.34&&flying.length<180){
        flying.push({
          x:px,y:py,
          vx:nx*side*(.6+Math.random()*1.4),
          vy:ny*side*(.6+Math.random()*1.4),
          size,color,age:0,life:9+Math.random()*9
        });
      }
    }
  }
}
function drawMovingGrains(){
  const remaining=[];
  ctx.save();
  ctx.beginPath();
  ctx.rect(pane.x,pane.y,pane.w,pane.h);
  ctx.clip();
  for(const p of flying){
    p.x+=p.vx;p.y+=p.vy;
    p.vx*=.88;p.vy*=.88;p.age++;
    if(p.age>=p.life){
      if(p.x>1&&p.y>1&&p.x<pane.w-1&&p.y<pane.h-1){
        sand.fillStyle=p.color;
        sand.fillRect(p.x,p.y,p.size,p.size*.8);
      }
    }else{
      ctx.globalAlpha=Math.min(1,(p.life-p.age)/5);
      ctx.fillStyle=p.color;
      ctx.fillRect(pane.x+p.x,pane.y+p.y,p.size,p.size*.8);
      remaining.push(p);
    }
  }
  ctx.restore();
  flying=remaining;
}
function beginMagic(now){
  phase="magic";
  drawing=false;
  visible=false;
  magicStart=now;
  patternBox.classList.add("hidden");
  oldMarks=document.createElement("canvas");
  oldMarks.width=pane.w;
  oldMarks.height=pane.h;
  oldMarks.getContext("2d").drawImage(layer,0,0);
  fillSand();
}
function clamp01(value){return Math.max(0,Math.min(1,value))}
function traceMetrics(trace){
  if(trace.lengths)return trace;
  const points=trace.points;
  const lengths=[];
  let total=0;
  for(let i=1;i<points.length;i++){
    const d=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]);
    lengths.push(d);
    total+=d;
  }
  trace.lengths=lengths;
  trace.total=total;
  return trace;
}
function pointOnTrace(trace,t){
  const {points,lengths,total}=traceMetrics(trace);
  let distance=total*clamp01(t);
  for(let i=0;i<lengths.length;i++){
    if(distance<=lengths[i]||i===lengths.length-1){
      const f=lengths[i]?distance/lengths[i]:0;
      return{
        x:points[i][0]+(points[i+1][0]-points[i][0])*f,
        y:points[i][1]+(points[i+1][1]-points[i][1])*f
      };
    }
    distance-=lengths[i];
  }
  return{x:points[0][0],y:points[0][1]};
}
function dogRect(){
  const size=Math.min(pane.w*.93,pane.h*.94);
  return{x:pane.x+(pane.w-size)/2,y:pane.y+(pane.h-size)/2,size};
}
function drawDog(now){
  if(phase!=="magic"&&phase!=="dog")return;
  const rect=dogRect();
  const picture=currentImage;
  if(phase==="dog"){
    ctx.drawImage(picture,rect.x,rect.y,rect.size,rect.size);
    return;
  }
  const elapsed=now-magicStart;
  const progress=clamp01((elapsed-MAGIC_DELAY)/MAGIC_DURATION);
  if(progress<=0)return;
  maskCtx.clearRect(0,0,512,512);
  maskCtx.save();
  maskCtx.scale(512/1254,512/1254);
  maskCtx.strokeStyle="#fff";
  maskCtx.fillStyle="#fff";
  maskCtx.lineWidth=125;
  maskCtx.lineCap="round";
  maskCtx.lineJoin="round";
  for(const trace of activeTraces()){
    const t=clamp01((progress-trace.start)/trace.duration);
    if(t<=0)continue;
    maskCtx.lineWidth=trace.width||125;
    const {points:pts,lengths,total}=traceMetrics(trace);
    let remaining=total*t;
    maskCtx.beginPath();
    maskCtx.moveTo(pts[0][0],pts[0][1]);
    for(let i=0;i<lengths.length&&remaining>0;i++){
      const f=Math.min(1,remaining/(lengths[i]||1));
      maskCtx.lineTo(
        pts[i][0]+(pts[i+1][0]-pts[i][0])*f,
        pts[i][1]+(pts[i+1][1]-pts[i][1])*f
      );
      remaining-=lengths[i];
    }
    maskCtx.stroke();
    if(total===0){
      maskCtx.beginPath();
      maskCtx.arc(pts[0][0],pts[0][1],62,0,Math.PI*2);
      maskCtx.fill();
    }
  }
  maskCtx.restore();
  revealCtx.clearRect(0,0,512,512);
  revealCtx.globalCompositeOperation="source-over";
  revealCtx.drawImage(picture,0,0,512,512);
  revealCtx.globalCompositeOperation="destination-in";
  revealCtx.drawImage(mask,0,0);
  revealCtx.globalCompositeOperation="source-over";
  ctx.drawImage(reveal,rect.x,rect.y,rect.size,rect.size);
  if(progress>.82){
    ctx.save();
    ctx.globalAlpha=clamp01((progress-.82)/.18);
    ctx.drawImage(picture,rect.x,rect.y,rect.size,rect.size);
    ctx.restore();
  }
}
function drawMagic(now){
  if(phase!=="magic")return;
  const progress=clamp01((now-magicStart-MAGIC_DELAY)/MAGIC_DURATION);
  const rect=dogRect();
  ctx.save();
  ctx.translate(offsetX,offsetY);
  ctx.scale(scale,scale);
  ctx.beginPath();
  ctx.roundRect(pane.x,pane.y,pane.w,pane.h,7);
  ctx.clip();
  const currentTraces=activeTraces();
  for(let i=0;i<currentTraces.length;i++){
    const trace=currentTraces[i];
    const t=(progress-trace.start)/trace.duration;
    if(t<=0||t>=1)continue;
    const p=pointOnTrace(trace,t);
    const x=rect.x+p.x/1254*rect.size;
    const y=rect.y+p.y/1254*rect.size;
    const alpha=Math.min(1,t*7,(1-t)*9);
    const size=i%4===0?35:24;
    const pulse=1+.13*Math.sin(now*.012+i*3);
    ctx.globalAlpha=alpha*.48;
    const halo=ctx.createRadialGradient(x,y,0,x,y,size*.95);
    halo.addColorStop(0,"rgba(255,248,215,.85)");
    halo.addColorStop(.35,"rgba(255,210,118,.45)");
    halo.addColorStop(1,"rgba(255,210,118,0)");
    ctx.fillStyle=halo;
    ctx.beginPath();
    ctx.arc(x,y,size*.95,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=alpha;
    if(sparkle.complete&&sparkle.naturalWidth){
      const s=size*pulse;
      ctx.drawImage(sparkle,x-s/2,y-s/2,s,s);
    }else{
      ctx.fillStyle="#fff4c4";
      ctx.beginPath();
      ctx.arc(x,y,2.5,0,Math.PI*2);
      ctx.fill();
    }
    for(let j=0;j<5;j++){
      const angle=i*2.4+j*2.4;
      const d=7+j*2.4+2*Math.sin(now*.004+i+j);
      ctx.globalAlpha=alpha*(.28+j*.1);
      ctx.fillStyle=j%3===0?"#c8def5":"#ffe8aa";
      ctx.beginPath();
      ctx.arc(x+Math.cos(angle)*d,y+Math.sin(angle)*d,j%3===0?1:1.6,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
  if(now-magicStart>MAGIC_DELAY+MAGIC_DURATION+120)finishMagic();
}
function finishMagic(){
  phase="dog";
  oldMarks=null;
  canvas.classList.add("finished");
  resetButton.hidden=true;
  wordBox.textContent=rounds[roundIndex].name;
  wordBox.hidden=false;
  if(roundIndex===rounds.length-1){
    nextButton.classList.remove("show");
    endTimer=setTimeout(()=>{
      if(phase==="dog"&&modeIndex>=0)endBox.hidden=false;
    },1500);
  }else{
    nextButton.textContent="Следующий рисунок";
    nextButton.classList.add("show");
  }
}
function moveBrush(from,to){
  const dx=to.x-from.x,dy=to.y-from.y;
  const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/4));
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    stamp(from.x+dx*t,from.y+dy*t,dx,dy);
  }
}
canvas.addEventListener("pointerdown",event=>{
  if(!ready||phase!=="draw")return;
  const p=position(event);
  if(!inside(p.x,p.y))return;
  event.preventDefault();
  canvas.setPointerCapture(event.pointerId);
  drawing=true;
  visible=true;
  pointer=p;
  last=p;
  stroke=[p];
  stamp(p.x,p.y,1,0);
});
canvas.addEventListener("pointerenter",event=>{
  if(phase!=="draw")return;
  pointer=position(event);
  visible=inside(pointer.x,pointer.y);
});
canvas.addEventListener("pointermove",event=>{
  if(!ready||phase!=="draw")return;
  const p=position(event);
  pointer=p;
  visible=inside(p.x,p.y);
  if(!drawing||!last)return;
  event.preventDefault();
  if(Math.hypot(p.x-last.x,p.y-last.y)>.7){
    moveBrush(last,p);
    stroke.push(p);
  }
  last=p;
});
function release(){
  if(drawing&&phase==="draw"&&stroke.length>1){
    strokes.push(stroke);
    const kind=rounds[roundIndex].pattern;
    if(matchesPattern(combinedStrokes(),kind)){
      if(currentImage)beginMagic(performance.now());
      else pendingMagic=true;
    }
  }
  drawing=false;
  last=null;
  stroke=[];
}
canvas.addEventListener("pointerup",release);
canvas.addEventListener("pointercancel",release);
canvas.addEventListener("pointerleave",()=>{
  if(!drawing)visible=false;
});
function resetRound(){
  if(!ready)return;
  clearTimeout(endTimer);
  endBox.hidden=true;
  pendingMagic=false;
  fillSand();
  phase="draw";
  drawing=false;
  visible=false;
  oldMarks=null;
  stroke=[];
  strokes=[];
  showPattern();
}
function openRound(){
  const token=++loadToken;
  const round=rounds[roundIndex];
  currentImage=null;
  menuStatus.textContent="";
  controls.hidden=false;
  resetRound();
  const picture=new Image();
  loadFirst(picture,round.file).then(()=>{
    if(token!==loadToken)return;
    currentImage=picture;
    if(pendingMagic)beginMagic(performance.now());
  }).catch(error=>{
    if(token!==loadToken)return;
    goMenu();
    menuStatus.textContent="Не найдена картинка: "+round.file[0];
    console.error(error);
  });
}
function startMode(index){
  if(!ready)return;
  modeIndex=index;
  rounds=groups[index];
  roundIndex=0;
  menu.hidden=true;
  backButton.hidden=false;
  phase="intro";
  introBox.hidden=false;
}
beginButton.addEventListener("click",()=>{
  introBox.hidden=true;
  openRound();
});
menu.querySelectorAll("[data-mode]").forEach(button=>{
  button.addEventListener("click",()=>startMode(Number(button.dataset.mode)));
});
function goMenu(){
  ++loadToken;
  clearTimeout(endTimer);
  modeIndex=-1;
  phase="menu";
  currentImage=null;
  pendingMagic=false;
  drawing=false;
  visible=false;
  flying=[];
  menuStatus.textContent="";
  menu.hidden=false;
  backButton.hidden=true;
  controls.hidden=true;
  patternBox.classList.add("hidden");
  wordBox.hidden=true;
  endBox.hidden=true;
  introBox.hidden=true;
  canvas.classList.remove("finished");
}
backButton.addEventListener("click",goMenu);
playAgain.addEventListener("click",goMenu);
resetButton.addEventListener("click",resetRound);
nextButton.addEventListener("click",()=>{
  if(roundIndex>=rounds.length-1)return;
  roundIndex++;
  openRound();
});
function render(now){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(ready){
    drawBackground();
    if(modeIndex>=0){
      ctx.save();
      ctx.translate(offsetX,offsetY);
      ctx.scale(scale,scale);
      ctx.drawImage(table,0,0,960,540);
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(pane.x,pane.y,pane.w,pane.h,7);
      ctx.clip();
      ctx.drawImage(layer,pane.x,pane.y);
      if(phase==="magic"&&oldMarks){
        const fade=1-clamp01((now-magicStart-100)/650);
        ctx.globalAlpha=fade;
        ctx.drawImage(oldMarks,pane.x,pane.y);
        ctx.globalAlpha=1;
      }
      drawDog(now);
      ctx.restore();
      drawMovingGrains();
      if(visible&&inside(pointer.x,pointer.y)){
        ctx.save();
        ctx.translate(pointer.x,pointer.y);
        ctx.rotate(-.45);
        if(brush.complete&&brush.naturalWidth){
          // Наша кисточка brush.png: кончик щетины совпадает с точкой рисования.
          ctx.drawImage(brush,400,0,224,1536,-8,-55,16,58);
        }else{
          ctx.shadowColor="#3b261b77";
          ctx.shadowBlur=4;
          ctx.fillStyle="#8d5b32";
          ctx.fillRect(-3,-34,6,26);
          ctx.fillStyle="#d2b486";
          ctx.beginPath();
          ctx.moveTo(-5,-8);
          ctx.lineTo(5,-8);
          ctx.lineTo(1,1);
          ctx.fill();
        }
        ctx.restore();
      }
      ctx.restore();
      drawMagic(now);
    }
  }
  requestAnimationFrame(render);
}
Promise.all([
  load(floor,"fon1.png"),
  load(table,"stol1.png"),
  load(texture,"pesok.png")
]).then(()=>{
  fillSand();
  ready=true;
  patternBox.classList.add("hidden");
  loadFirst(sparkle,["blik.png","gitkeep/blik.png"]).catch(()=>{});
  load(brush,"brush.png").catch(()=>{});
}).catch(error=>{
  menuStatus.textContent=error.message;
  console.error(error);
});
requestAnimationFrame(render);
</script>
