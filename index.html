<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Волшебный песочный стол</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100svh;
  overflow:hidden;
  background:#111536;
  font-family:system-ui,Arial,sans-serif;
}
.scene{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  touch-action:none;
  user-select:none;
}
canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
  cursor:none;
}
.hint{
  position:absolute;
  top:2%;
  left:2%;
  max-width:43%;
  padding:8px 12px;
  border-radius:11px;
  background:#fff2d4e8;
  color:#4b3324;
  font-size:clamp(11px,1.3vw,16px);
  line-height:1.3;
  pointer-events:none;
}
.controls{
  position:fixed;
  z-index:2;
  left:0;
  right:0;
  bottom:max(12px,env(safe-area-inset-bottom));
  display:flex;
  justify-content:center;
  pointer-events:none;
}
.controls button{pointer-events:auto}
button{
  min-height:44px;
  padding:10px 20px;
  border:1px solid #e6c98d;
  border-radius:13px;
  background:linear-gradient(#fff0c7,#e6bc78);
  color:#493223;
  box-shadow:0 4px 12px #0004;
  font:700 15px system-ui,sans-serif;
  cursor:pointer;
}
@media(max-width:600px){
  .hint{padding:5px 7px;border-radius:7px;font-size:9px}
  button{font-size:13px}
}
</style>
</head>
<body>
<div class="scene">
  <canvas id="game"
    aria-label="Рисуйте пальцем или мышкой на песочном столе"></canvas>
  <div class="hint" id="hint">Проведи пальцем или мышкой по песку</div>
</div>
<div class="controls">
  <button id="reset">Разровнять песок</button>
</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const hint=document.getElementById("hint");

const pane={x:261,y:72,w:434,h:390};
const radius=17;

const layer=document.createElement("canvas");
layer.width=pane.w;
layer.height=pane.h;
const sand=layer.getContext("2d");

const floor=new Image();
const table=new Image();

let ready=false;
let drawing=false;
let visible=false;
let last=null;
let pointer={x:0,y:0};

let scale=1;
let offsetX=0;
let offsetY=0;

function resize(){
  const box=canvas.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);

  canvas.width=Math.round(box.width*dpr);
  canvas.height=Math.round(box.height*dpr);

  // На узком экране стол становится крупнее.
  const logicalWidth=box.width<box.height?560:960;
  scale=Math.min(
    canvas.width/logicalWidth,
    canvas.height/540
  );

  offsetX=(canvas.width-960*scale)/2;
  offsetY=(canvas.height-540*scale)/2;
}

window.addEventListener("resize",resize);
resize();

function load(image,path){
  return new Promise((resolve,reject)=>{
    image.onload=resolve;
    image.onerror=()=>reject(new Error("Не удалось загрузить "+path));
    image.src=path;
  });
}

function fillSand(){
  sand.globalCompositeOperation="source-over";
  sand.clearRect(0,0,pane.w,pane.h);

  const image=sand.createImageData(pane.w,pane.h);
  const d=image.data;

  for(let y=0;y<pane.h;y++){
    for(let x=0;x<pane.w;x++){
      const i=(y*pane.w+x)*4;
      const wave=7*Math.sin(x*.025+y*.011)
                +5*Math.sin(y*.047-x*.013);
      const noise=(Math.random()-.5)*31;
      const shade=wave+noise;

      d[i]=176+shade;
      d[i+1]=139+shade*.87;
      d[i+2]=96+shade*.68;
      d[i+3]=255;
    }
  }

  sand.putImageData(image,0,0);

  for(let i=0;i<23000;i++){
    const x=Math.random()*pane.w;
    const y=Math.random()*pane.h;
    const size=.35+Math.random()*1.2;

    sand.fillStyle=Math.random()>.49
      ?"rgba(255,231,174,.23)"
      :"rgba(75,47,31,.16)";

    sand.fillRect(x,y,size,size);
  }
}

function inside(x,y){
  return x>=pane.x+5
      && x<pane.x+pane.w-5
      && y>=pane.y+5
      && y<pane.y+pane.h-5;
}

function position(event){
  const box=canvas.getBoundingClientRect();

  return {
    x:((event.clientX-box.left)*canvas.width/box.width-offsetX)/scale,
    y:((event.clientY-box.top)*canvas.height/box.height-offsetY)/scale
  };
}

function drawBackground(){
  const factor=Math.max(
    canvas.width/floor.width,
    canvas.height/floor.height
  );
  const w=floor.width*factor;
  const h=floor.height*factor;

  ctx.drawImage(
    floor,
    (canvas.width-w)/2,
    (canvas.height-h)/2,
    w,h
  );
}

function stamp(x,y,dx,dy){
  if(!inside(x,y))return;

  const sx=x-pane.x;
  const sy=y-pane.y;
  const r=radius;

  const fade=sand.createRadialGradient(
    sx,sy,r*.14,
    sx,sy,r
  );
  fade.addColorStop(0,"rgba(0,0,0,.98)");
  fade.addColorStop(.48,"rgba(0,0,0,.92)");
  fade.addColorStop(.78,"rgba(0,0,0,.38)");
  fade.addColorStop(1,"rgba(0,0,0,0)");

  sand.globalCompositeOperation="destination-out";
  sand.fillStyle=fade;
  sand.beginPath();
  sand.arc(sx,sy,r,0,Math.PI*2);
  sand.fill();

  sand.globalCompositeOperation="source-over";

  const len=Math.hypot(dx,dy)||1;
  const nx=-dy/len;
  const ny=dx/len;

  for(const side of [-1,1]){
    for(let j=0;j<3;j++){
      const spread=r*(.76+Math.random()*.32);
      const jitter=(Math.random()-.5)*6;
      const px=sx+nx*spread*side+dx/len*jitter;
      const py=sy+ny*spread*side+dy/len*jitter;

      if(px<1||py<1||px>=pane.w-1||py>=pane.h-1)continue;

      const size=1.2+Math.random()*2.6;
      sand.fillStyle=side===1
        ?"rgba(104,71,46,.56)"
        :"rgba(235,195,133,.65)";

      sand.beginPath();
      sand.ellipse(px,py,size,size*.65,0,0,Math.PI*2);
      sand.fill();
    }
  }
}

function moveBrush(from,to){
  const dx=to.x-from.x;
  const dy=to.y-from.y;
  const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/4));

  for(let i=0;i<=steps;i++){
    const t=i/steps;
    stamp(from.x+dx*t,from.y+dy*t,dx,dy);
  }
}

canvas.addEventListener("pointerdown",event=>{
  if(!ready)return;

  const p=position(event);
  if(!inside(p.x,p.y))return;

  event.preventDefault();
  canvas.setPointerCapture(event.pointerId);

  drawing=true;
  visible=true;
  pointer=p;
  last=p;

  stamp(p.x,p.y,1,0);
  hint.textContent="Посмотри, как светится след под песком";
});

canvas.addEventListener("pointermove",event=>{
  if(!ready)return;

  const p=position(event);
  pointer=p;
  visible=inside(p.x,p.y);

  if(!drawing||!last)return;

  event.preventDefault();
  moveBrush(last,p);
  last=p;
});

function release(){
  drawing=false;
  last=null;
}

canvas.addEventListener("pointerup",release);
canvas.addEventListener("pointercancel",release);
canvas.addEventListener("pointerleave",()=>{
  if(!drawing)visible=false;
});

document.getElementById("reset").addEventListener("click",()=>{
  if(!ready)return;

  fillSand();
  hint.textContent="Проведи пальцем или мышкой по песку";
});

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(ready){
    drawBackground();

    ctx.save();
    ctx.translate(offsetX,offsetY);
    ctx.scale(scale,scale);

    ctx.drawImage(table,0,0,960,540);

    ctx.save();
    ctx.beginPath();
    ctx.roundRect(pane.x,pane.y,pane.w,pane.h,7);
    ctx.clip();
    ctx.drawImage(layer,pane.x,pane.y);
    ctx.restore();

    if(visible&&inside(pointer.x,pointer.y)){
      ctx.save();
      ctx.translate(pointer.x,pointer.y);
      ctx.rotate(-.55);

      ctx.shadowColor="#3b261b77";
      ctx.shadowBlur=4;

      ctx.fillStyle="#8d5b32";
      ctx.fillRect(-3,-34,6,26);

      ctx.fillStyle="#d2b486";
      ctx.beginPath();
      ctx.moveTo(-5,-8);
      ctx.lineTo(5,-8);
      ctx.lineTo(1,1);
      ctx.lineTo(-1,1);
      ctx.fill();

      ctx.restore();
    }

    ctx.restore();
  }

  requestAnimationFrame(render);
}

Promise.all([
  load(floor,"fon1.png"),
  load(table,"stol1.png")
])
.then(()=>{
  fillSand();
  ready=true;
})
.catch(error=>{
  hint.textContent=error.message;
  console.error(error);
});

requestAnimationFrame(render);
</script>
</body>
</html>
